[tool.poetry]
name = "agent-qa-core"
version = "0.1.0"
description = "Local-first test memory with REST and MCP interfaces."
authors = ["Agent QA Contributors <maintainers@agent-qa.dev>"]
maintainers = ["Agent QA Contributors <maintainers@agent-qa.dev>"]
license = "MIT"
packages = [{ include = "agent_qa" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
sqlmodel = ">=0.0.22,<0.1"
pydantic = ">=2.9,<3.0"
pydantic-settings = ">=2.5,<3.0"
httpx = ">=0.27,<1.0"
structlog = ">=24.4,<26.0"
mcp = ">=1.9,<2.0"
jsonschema = ">=4.23,<5.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
pytest-cov = ">=5.0,<7.0"
pytest-asyncio = ">=0.24,<1.0"
respx = ">=0.21,<1.0"
ruff = ">=0.9,<1.0"
mypy = ">=1.13,<2.0"
types-jsonschema = ">=4.23,<5.0"

[tool.poetry.scripts]
agent-qa-core = "agent_qa.api:main"
agent-qa-mcp = "agent_qa.mcp_server:main"

[build-system]
requires = ["poetry-core>=1.9,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:starlette.exceptions.StarletteDeprecationWarning",
  "ignore:unclosed database:ResourceWarning",
]

[tool.coverage.run]
branch = true
source = ["agent_qa"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_qa", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "C4",
  "SIM",
  "PIE",
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["agent_qa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["agent_qa", "tests"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true