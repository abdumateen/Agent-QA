[tool.poetry]
name = "agent-qa"
version = "0.1.0"
description = "Command-line access to the Agent QA test memory service."
authors = ["Agent QA Contributors <maintainers@agent-qa.dev>"]
maintainers = ["Agent QA Contributors <maintainers@agent-qa.dev>"]
license = "MIT"
packages = [{ include = "agent_qa_cli" }]
keywords = ["testing", "fixtures", "contracts", "failures", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
httpx = ">=0.27,<1.0"
typer = ">=0.15,<1.0"
pydantic = ">=2.9,<3.0"
structlog = ">=24.4,<26.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"
ruff = ">=0.9,<1.0"
mypy = ">=1.13,<2.0"
pytest-cov = ">=5.0,<7.0"

[tool.poetry.scripts]
agent-qa = "agent_qa_cli.main:app"

[build-system]
requires = ["poetry-core>=1.9,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["agent_qa_cli"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["agent_qa_cli", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["agent_qa_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["agent_qa_cli", "tests"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true