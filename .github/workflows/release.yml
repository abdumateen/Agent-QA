name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag against package versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("Release tags must use vMAJOR.MINOR.PATCH.")

          version = tag[1:]
          packages = (
              (Path("core"), "agent_qa"),
              (Path("cli"), "agent_qa_cli"),
              (Path("plugins/pytest-agent-qa"), "pytest_agent_qa"),
          )

          for directory, module in packages:
              manifest_path = directory / "pyproject.toml"
              manifest = tomllib.loads(manifest_path.read_text(encoding="utf-8"))
              declared = manifest["tool"]["poetry"]["version"]
              if declared != version:
                  raise SystemExit(f"Version mismatch in {manifest_path}")

              init_path = directory / module / "__init__.py"
              tree = ast.parse(init_path.read_text(encoding="utf-8"))
              versions = []
              for statement in tree.body:
                  if (
                      isinstance(statement, ast.AnnAssign)
                      and isinstance(statement.target, ast.Name)
                      and statement.target.id == "__version__"
                      and statement.value is not None
                  ):
                      versions.append(ast.literal_eval(statement.value))
              if versions != [version]:
                  raise SystemExit(f"Version mismatch in {init_path}")

          node_manifest = Path("plugins/jest-agent-qa/package.json")
          node_package = json.loads(node_manifest.read_text(encoding="utf-8"))
          if node_package["version"] != version:
              raise SystemExit(f"Version mismatch in {node_manifest}")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(
              rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}$",
              changelog,
              re.MULTILINE,
          ):
              raise SystemExit("The release requires a dated changelog entry.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY

  python:
    name: Build ${{ matrix.package }}
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            directory: core
            test: true
          - package: cli
            directory: cli
            test: false
          - package: pytest-plugin
            directory: plugins/pytest-agent-qa
            test: true

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install "poetry==2.1.3" "twine>=6,<7"

      - name: Install package dependencies
        working-directory: ${{ matrix.directory }}
        run: poetry install --no-interaction

      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        run: poetry run ruff format --check .

      - name: Lint
        working-directory: ${{ matrix.directory }}
        run: poetry run ruff check .

      - name: Type-check
        working-directory: ${{ matrix.directory }}
        run: poetry run mypy .

      - name: Run tests
        if: matrix.test
        working-directory: ${{ matrix.directory }}
        run: poetry run pytest

      - name: Verify CLI entry point
        if: matrix.package == 'cli'
        working-directory: ${{ matrix.directory }}
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          poetry run agent-qa --help
          test "$(poetry run agent-qa version)" = "$RELEASE_VERSION"

      - name: Build distributions
        working-directory: ${{ matrix.directory }}
        run: |
          poetry build
          python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-python-${{ matrix.package }}
          path: ${{ matrix.directory }}/dist/*
          if-no-files-found: error
          retention-days: 7

  javascript:
    name: Build Jest package
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: plugins/jest-agent-qa
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: plugins/jest-agent-qa
        run: npm run typecheck

      - name: Test
        working-directory: plugins/jest-agent-qa
        run: npm test

      - name: Build package
        working-directory: plugins/jest-agent-qa
        run: |
          npm run build
          mkdir -p ../../release-assets
          npm pack --pack-destination ../../release-assets

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-jest
          path: release-assets/*.tgz
          if-no-files-found: error
          retention-days: 7

  go:
    name: Verify and archive Go package
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Check formatting
        working-directory: plugins/go-agent-qa
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: plugins/go-agent-qa
        run: go vet ./...

      - name: Test with race detection
        working-directory: plugins/go-agent-qa
        run: go test -race -count=1 ./...

      - name: Archive module source
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          mkdir -p release-assets
          git archive \
            --format=tar.gz \
            --prefix="go-agent-qa-${RELEASE_VERSION}/" \
            --output="release-assets/go-agent-qa-${RELEASE_VERSION}.tar.gz" \
            HEAD:plugins/go-agent-qa

      - name: Upload module archive
        uses: actions/upload-artifact@v4
        with:
          name: release-go
          path: release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  container:
    name: Verify deployment image
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build core and MCP image
        run: docker compose build

  publish:
    name: Publish GitHub release
    needs:
      - validate-version
      - python
      - javascript
      - go
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
          sha256sum -- * > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Agent QA ${RELEASE_VERSION}" \
            --generate-notes \
            release-assets/*