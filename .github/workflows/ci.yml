name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
          cache-dependency-path: |
            core/poetry.lock
            cli/poetry.lock
            plugins/pytest-agent-qa/poetry.lock

      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Install core dependencies
        working-directory: core
        run: poetry install --no-interaction

      - name: Check core formatting
        working-directory: core
        run: poetry run ruff format --check .

      - name: Lint core
        working-directory: core
        run: poetry run ruff check .

      - name: Type-check core
        working-directory: core
        run: poetry run mypy .

      - name: Test core
        working-directory: core
        run: poetry run pytest

      - name: Install CLI dependencies
        working-directory: cli
        run: poetry install --no-interaction

      - name: Check CLI formatting
        working-directory: cli
        run: poetry run ruff format --check .

      - name: Lint CLI
        working-directory: cli
        run: poetry run ruff check .

      - name: Type-check CLI
        working-directory: cli
        run: poetry run mypy .

      - name: Install pytest plugin dependencies
        working-directory: plugins/pytest-agent-qa
        run: poetry install --no-interaction

      - name: Check pytest plugin formatting
        working-directory: plugins/pytest-agent-qa
        run: poetry run ruff format --check .

      - name: Lint pytest plugin
        working-directory: plugins/pytest-agent-qa
        run: poetry run ruff check .

      - name: Type-check pytest plugin
        working-directory: plugins/pytest-agent-qa
        run: poetry run mypy .

      - name: Test pytest plugin
        working-directory: plugins/pytest-agent-qa
        run: poetry run pytest

  javascript:
    name: Jest plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/jest-agent-qa/package.json

      - name: Install dependencies
        working-directory: plugins/jest-agent-qa
        run: npm install

      - name: Type-check
        working-directory: plugins/jest-agent-qa
        run: npm run typecheck

      - name: Build
        working-directory: plugins/jest-agent-qa
        run: npm run build

      - name: Test
        working-directory: plugins/jest-agent-qa
        run: npm test

  go:
    name: Go plugin
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Check formatting
        working-directory: plugins/go-agent-qa
        run: test -z "$(gofmt -l .)"

      - name: Test
        working-directory: plugins/go-agent-qa
        run: go test ./...