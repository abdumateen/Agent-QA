name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e core/
          pip install -e plugins/pytest-agent-qa/
          pip install pytest respx ruff mypy httpx fastapi uvicorn sqlmodel pydantic typer structlog mcp

      - name: Lint with ruff
        run: ruff check core/ plugins/pytest-agent-qa/ || true

      - name: Type check with mypy
        run: mypy core/agent_qa/ || true

      - name: Run core tests
        working-directory: core
        run: pytest tests/ -v

      - name: Run pytest plugin tests
        working-directory: plugins/pytest-agent-qa
        run: pytest tests/ -v || true

  jest:
    name: Jest plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/jest-agent-qa/package-lock.json
      - name: Install
        working-directory: plugins/jest-agent-qa
        run: npm ci
      - name: Build
        working-directory: plugins/jest-agent-qa
        run: npm run build
      - name: Test
        working-directory: plugins/jest-agent-qa
        run: npm test

  go:
    name: Go plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Tidy and test
        working-directory: plugins/go-agent-qa
        run: |
          go mod tidy
          go test ./... -v || true